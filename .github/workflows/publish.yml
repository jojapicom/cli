# Stages @jojapi/cli on npm when a tag v<version> is pushed. npm trusts this
# workflow (trusted publishing over OIDC): no npm token is stored, and every
# release carries a provenance statement linking it to its commit. A staged
# version goes live only when a maintainer approves it with 2FA on npmjs.com
# (or `npm stage approve <id>`).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      # Trusted publishing and staged publishing need a recent npm
      - run: npm install -g npm@latest
      - run: npm stage publish
